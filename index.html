<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 21st Birthday, Enad!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background-sparkles" aria-hidden="true"></div>

  <div class="balloon balloon-1"><span></span></div>
  <div class="balloon balloon-2"><span></span></div>
  <div class="balloon balloon-3"><span></span></div>
  <div class="balloon balloon-4"><span></span></div>

  <main class="page">
    <section class="hero">
      <p class="eyebrow">September 13</p>
      <h1>Happy Birthday, <span>Enad!</span></h1>

      <p class="instruction">Click the cake to open your birthday message ✨</p>
    </section>

    <section class="cake-stage">
      <div class="party-popper popper-left" aria-hidden="true">🎉</div>
      <div class="party-popper popper-right" aria-hidden="true">🎊</div>

      <button class="cake" id="cake" type="button" aria-expanded="false" aria-label="Open birthday cake message">
        <div class="candles">
          <div class="candle"><i></i></div>
          <div class="candle"><i></i></div>
          <div class="candle"><i></i></div>
        </div>

        <div class="cake-top">
          <div class="icing-drip drip-1"></div>
          <div class="icing-drip drip-2"></div>
          <div class="icing-drip drip-3"></div>
          <div class="sprinkles">
            <b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b>
          </div>
        </div>

        <div class="message-card">
          <div class="message-inner">
            <h2>To Enad 💙</h2>
            <p>
              Happy 21st Birthday! I hope this new chapter of your life brings you
              more reasons to smile, more adventures to remember, and more dreams
              coming true. You deserve a year full of happiness, good health,
              success, and people who genuinely appreciate you.
            </p>
            <p>
              Keep being the wonderful person you are, and never forget how much
              potential you have.
            </p>
            <p class="signature">Happy birthday, Enad! 🥳🎂✨</p>
          </div>
        </div>

        <div class="cake-bottom">
        </div>
      </button>

      <div class="confetti" id="confetti" aria-hidden="true"></div>
    </section>

  </main>

  <script>
    const cake = document.getElementById("cake");
    const confetti = document.getElementById("confetti");

    function burstConfetti() {
      confetti.innerHTML = "";

      const pieces = 50;
      for (let i = 0; i < pieces; i++) {
        const piece = document.createElement("span");
        piece.style.setProperty("--x", `${Math.random() * 460 - 230}px`);
        piece.style.setProperty("--y", `${Math.random() * -330 - 80}px`);
        piece.style.setProperty("--r", `${Math.random() * 720 - 360}deg`);
        piece.style.setProperty("--delay", `${Math.random() * 0.2}s`);
        piece.style.setProperty("--size", `${6 + Math.random() * 7}px`);
        piece.className = `piece piece-${(i % 6) + 1}`;
        confetti.appendChild(piece);
      }

      confetti.classList.remove("burst");
      void confetti.offsetWidth;
      confetti.classList.add("burst");
    }

    cake.addEventListener("click", () => {
      const isOpen = cake.classList.toggle("open");
      cake.setAttribute("aria-expanded", String(isOpen));

      if (isOpen) {
        burstConfetti();
      }
    });
  </script>
</body>
</html>
